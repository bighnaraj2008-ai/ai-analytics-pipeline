version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_analytics_postgres
    environment:
      POSTGRES_USER: analytics
      POSTGRES_PASSWORD: analytics
      POSTGRES_DB: ai_analytics
    ports:
      - "5432:5432"
    volumes:
      # Named volume for data persistence across container restarts
      - ai_analytics_pgdata:/var/lib/postgresql/data
      # Mount initialization script
      - ./init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analytics -d ai_analytics"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  ai_analytics_pgdata:
